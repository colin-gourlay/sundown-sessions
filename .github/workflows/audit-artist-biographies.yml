name: Audit Artist Biographies

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - src/content/artists/**
      - scripts/audit-artist-biographies.py
      - .github/workflows/audit-artist-biographies.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source using v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Generate artist biography review report
        run: python3 scripts/audit-artist-biographies.py

      - name: Upload artist biography review report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artist-biography-audit
          path: reports/artist-biography-audit.md

      - name: Open report update pull request
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automated/artist-biography-audit-${{ github.run_id }}
        run: |
          set -euo pipefail

          if git diff --quiet -- reports/artist-biography-audit.md; then
            echo "Artist biography audit report is unchanged; no pull request needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add reports/artist-biography-audit.md
          git commit -m "docs(artists): update biography audit report"
          git push --set-upstream origin "$BRANCH_NAME"
          gh pr create \
            --title "docs(artists): update biography audit report" \
            --body "$(cat <<'EOF'
## Summary

- Regenerates the artist biography audit report from the scheduled workflow.
- Surfaces artist pages that need a human editorial biography refresh.
- Does not automatically rewrite artist biographies; see docs/artist-biography-automation.md for the safety model.

## Testing

- python3 scripts/audit-artist-biographies.py

## Accessibility

- [x] No rendered UI changes.
- [x] Keyboard navigation, focus visibility, labels, alternative text, colour contrast, and responsive reflow are not affected.
- [x] Automated accessibility checks were not required for this report-only update.
EOF
)"
