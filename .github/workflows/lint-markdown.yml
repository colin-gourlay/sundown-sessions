name: Lint Markdown

on:
  push:
    paths:
      - "**/*.md"
      - ".markdownlint*"
      - ".github/workflows/lint-markdown.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint*"
      - ".github/workflows/lint-markdown.yml"

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source using v4.1.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Markdown using v22.0.0
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v22.0.0
        with:
          globs: |
            **/*.md
            !src/themes/**
