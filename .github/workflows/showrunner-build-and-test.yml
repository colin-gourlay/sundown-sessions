name: showrunner - build and test

on:
  push:
    branches:
      - main
    paths:
      - 'showrunner/**'
  pull_request:
    paths:
      - 'showrunner/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore showrunner/Sundown.Showrunner.sln

      - name: Build
        run: dotnet build showrunner/Sundown.Showrunner.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test showrunner/Sundown.Showrunner.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
