name: Validate Hugo Content

on:
  pull_request:
    paths:
      - src/content/**
      - src/layouts/**
      - src/assets/**
      - src/config/**
      - scripts/audit-release-types.py
      - scripts/audit-release-metadata.py
      - scripts/audit-artist-links.py
      - config/artist-link-exceptions.json
      - docs/artist-link-validation.md
      - reports/release-type-audit.md
      - reports/release-metadata-audit.md
      - tests/test_audit_release_types.py
      - tests/test_audit_release_metadata.py
      - tests/test_audit_artist_links.py
      - tests/test_correction_flow.py
      - tests/test_pagination.py
      - .github/workflows/validate-hugo-content.yml
  push:
    branches:
      - main
    paths:
      - src/content/**
      - src/layouts/**
      - src/assets/**
      - src/config/**
      - scripts/audit-release-types.py
      - scripts/audit-release-metadata.py
      - scripts/audit-artist-links.py
      - config/artist-link-exceptions.json
      - docs/artist-link-validation.md
      - reports/release-type-audit.md
      - reports/release-metadata-audit.md
      - tests/test_audit_release_types.py
      - tests/test_audit_release_metadata.py
      - tests/test_audit_artist_links.py
      - tests/test_correction_flow.py
      - tests/test_pagination.py
      - .github/workflows/validate-hugo-content.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout source using v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate content by building Hugo site
        run: |
          hugo \
            --source src \
            --printPathWarnings \
            --environment production \
            --baseURL https://example.invalid/

      - name: Test correction flow configuration
        run: python3 tests/test_correction_flow.py

      - name: Test pagination boundaries and navigation
        run: python3 tests/test_pagination.py

      - name: Audit published Artist links
        run: |
          python3 tests/test_audit_artist_links.py
          python3 scripts/audit-artist-links.py

      - name: Validate release types
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML
          python3 scripts/audit-release-types.py --check-report

      - name: Audit release details metadata
        run: python3 scripts/audit-release-metadata.py --check-report
